<body>
<div class="w" id="app">جاري التحميل...</div>
<script>
// ====== إعدادات Supabase ======
var SUPABASE_URL='https://rizklgstmbslmfvqhuuw.supabase.co';
var SUPABASE_KEY='sb_publishable_zp9FHR3ue1bcRulefHvA6g_HKK0pmUD';
// ===============================
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var app=document.getElementById('app'),user=null,shops=[];
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function clean(s){return String(s||'').trim().replace(/^@/,'')}
function digits(s){return String(s||'').replace(/\D/g,'')}

function resetTheme(){document.documentElement.removeAttribute('data-theme');document.body.style.background='';document.body.className='';['--ac','--act','--hf','--lb','--lt','--pl','--pt'].forEach(function(v){document.documentElement.style.removeProperty(v)})}
async function route(){
  resetTheme();app.className='w';
  var h=location.hash.slice(1);
  if(h.indexOf('m-')===0){var pp=h.slice(2).split('~');return store(pp[0],pp[1]||null)}
  if(h.indexOf('r-')===0)return report(h.slice(2));
  var r=await sb.auth.getSession();user=r.data.session?r.data.session.user:null;
  if(!user)return login();
  var rr=await sb.rpc('my_role'),role=rr&&rr.data;
  if(!role&&rr&&rr.error){
    // قاعدة البيانات لم تُحدَّث بعد أو خطأ مؤقت: المدير وحده يقرأ جدول shops مباشرة فنستخدمه كفحص احتياطي
    var pr=await sb.from('shops').select('id').limit(1);
    if(pr&&pr.data&&pr.data.length)role='admin';
    else{app.className='w';app.innerHTML='<div class="top"><b>📱 حسابي</b><button class="s sm" id="out">خروج</button></div><div class="card" style="text-align:center"><h2>تعذر التحقق من صلاحيتك</h2><p class="mu">'+esc(rr.error.message||'')+'</p><button id="rt">إعادة المحاولة</button></div>';document.getElementById('out').onclick=async function(){await sb.auth.signOut();route()};document.getElementById('rt').onclick=function(){route()};return}
  }
  if(role==='admin')return admin();
  if(role==='client')return clientHome();
  noRole();
}
function noRole(){
  app.className='w';
  app.innerHTML='<div class="top"><b>📱 حسابي</b><button class="s sm" id="out">خروج</button></div><div class="card" style="text-align:center"><h2>حسابك غير مربوط بمحل بعد</h2><p class="mu">تواصل مع مزوّد الخدمة ليربط حسابك بمحلك.</p></div>';
  document.getElementById('out').onclick=async function(){await sb.auth.signOut();route()};
}
var OWN=null,OWNST=null,OWNH=null,otab='home';
async function clientHome(){
  var r=await sb.rpc('my_shop'),d=r&&r.data;
  if(!d||d.role!=='client')return noRole();
  OWNH=d;renderOwner();
}
function renderOwner(){
  app.className='';document.body.className='ad';applyTheme();
  app.innerHTML=shell({navs:[['home','الرئيسية','grid'],['edit','تعديل صفحتي','edit']],cur:otab,who:user.email||'',role:'صاحب المحل',search:false,bell:false});
  bindShell(function(id){otab=id;renderOwner()});
  if(otab==='edit')ownerEdit();else ownerHome();
}
function ownerHome(){
  var d=OWNH;
  var S1={active:['active','فعّال'],grace_period:['grace','مهلة سماح'],expired:['expired','منتهي'],suspended:['suspended','موقوف إدارياً']}[d.state]||['active',String(d.state)];
  var dl=d.days_left,msg='',cls='';
  if(d.state==='active'){
    if(dl==null)msg='اشتراكك فعّال.';
    else if(dl<=14){msg='ينتهي اشتراكك '+(dl===0?'اليوم':'خلال '+dl+' يوم')+' ('+d.ends_on+'). جدّد مبكراً حتى لا تتوقف صفحتك.';cls='warn'}
    else msg='اشتراكك فعّال حتى '+d.ends_on+' (باقي '+dl+' يوم).';
  }else if(d.state==='grace_period'){msg='انتهى اشتراكك بتاريخ '+d.ends_on+'. صفحتك ما زالت تعمل خلال مهلة السماح (باقي '+(d.grace_days_left>0?d.grace_days_left+' يوم':'آخر يوم')+'). جدّد لتجنب التوقف.';cls='warn'}

function qr(slug,SR){
  var base=location.href.split('#')[0],srcs=[{k:'',n:'الرئيسي'}].concat((SR||[]).filter(function(x){return x.k}));
  document.getElementById('qbox').innerHTML='<div class="card" style="text-align:center"><h2>البار كود</h2>'+(srcs.length>1?'<select id="qs">'+srcs.map(function(x){return '<option value="'+esc(x.k)+'">'+esc(x.n||x.k)+'</option>'}).join('')+'</select>':'')+'<div id="qr"></div><p class="mu" style="word-break:break-all" dir="ltr" id="qu"></p><a class="btn" id="qp" target="_blank">معاينة صفحة الزبون</a><button id="dl">تحميل البار كود PNG</button></div>';
  var blob=null,fname,url;
  function gen(){
    var k=srcs.length>1?document.getElementById('qs').value:'';
    url=base+'#m-'+slug+(k?'~'+k:'');fname='qr-'+slug+(k?'-'+k:'')+'.png';blob=null;
    document.getElementById('qr').innerHTML='';document.getElementById('qu').textContent=url;document.getElementById('qp').href=url;
    new QRCode(document.getElementById('qr'),{text:url,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});
    setTimeout(function(){
      var c=document.querySelector('#qr canvas');if(!c)return;
      var o=document.createElement('canvas');o.width=o.height=720;var x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,720,720);x.drawImage(c,60,60,600,600);
      o.toBlob(function(b){blob=b},'image/png');
    },300);
  }
  if(srcs.length>1)document.getElementById('qs').onchange=gen;
  gen();
  document.getElementById('dl').onclick=async function(){
    if(!blob){alert('انتظر ثانية ثم اضغط مرة ثانية');return}
    var f=new File([blob],fname,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fname});return}}catch(e){if(e&&e.name==='AbortError')return}
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
  };
}
