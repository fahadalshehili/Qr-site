<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6ea;--ac:#0f766e;--act:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mu:#98a2b3;--bd:#272d37;--ac:#2dd4bf;--act:#06201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
.w{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}
input,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}
button,.btn{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:var(--act);font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;margin-top:8px}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.shop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.shop:last-child{border:0}
.hero{text-align:center;padding:24px 8px 12px}
.logo{width:72px;height:72px;border-radius:50%;background:var(--lb,var(--ac));color:var(--lt,var(--act));overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 10px}
.lnk{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--tx);text-decoration:none;font-weight:600}
.lnk i{font-style:normal;font-size:20px}
input[type=time]{margin:0;padding:8px;direction:ltr}
.hr{display:grid;grid-template-columns:62px 40px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.hr input[type=checkbox]{width:20px;height:20px;margin:0}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.sw{width:36px;height:36px;padding:0;margin:0;border-radius:50%;border:3px solid var(--bd)}
.hrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hrow:last-child{border:0}.today{font-weight:700;background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:8px;padding-inline:8px}
.hero h1,.hero .mu{color:var(--hf,var(--tx))}
#sh{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.wide{max-width:900px}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}
.sm{width:auto;margin:0;padding:8px 14px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px;position:sticky;top:0;z-index:5}
.tabs button{margin:0;background:transparent;color:var(--mu);padding:10px 4px;font-size:14px}.tabs button.on{background:var(--ac);color:var(--act)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mu)}
.br{display:grid;grid-template-columns:72px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.br div{background:var(--bg);border-radius:6px;height:10px;overflow:hidden}.br i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{width:auto;margin:0;padding:6px 12px;font-size:13px;white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.chips button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.bd{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.bd.active{background:rgba(22,163,74,.15);color:#16a34a}.bd.soon{background:rgba(217,119,6,.15);color:#d97706}.bd.expired{background:rgba(220,38,38,.15);color:#dc2626}.bd.paused{background:rgba(120,120,120,.18);color:var(--mu)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.dot{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.item .g{flex:1;min-width:0}
#qr canvas,#qr img{width:220px;height:220px}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
#qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px;width:max-content;margin:8px auto}
</style>
</head>

<div class="w" id="app">جاري التحميل...</div>
<script>
// ====== إعدادات Supabase ======
var SUPABASE_URL='https://rizklgstmbslmfvqhuuw.supabase.co';
var SUPABASE_KEY='sb_publishable_zp9FHR3ue1bcRulefHvA6g_HKK0pmUD';
// ===============================
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var app=document.getElementById('app'),user=null,shops=[];
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function clean(s){return String(s||'').trim().replace(/^@/,'')}
function digits(s){return String(s||'').replace(/\D/g,'')}

function resetTheme(){document.body.style.background='';['--ac','--act','--hf','--lb','--lt'].forEach(function(v){document.documentElement.style.removeProperty(v)})}
async function route(){

var COLORS=['#0f766e','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#16a34a','#111827'];
function parseH(h){try{var a=JSON.parse(h);if(Array.isArray(a)&&a.length==7)return a}catch(e){}return null}
function t12(t){var p=String(t).split(':'),h=+p[0],m=p[1]||'00',x=h>=12?'م':'ص';h=h%12||12;return h+':'+m+' '+x}
function hoursHtml(h){
  var a=parseH(h);
  if(!a)return h?'<p class="mu" style="text-align:center">🕒 '+esc(h)+'</p>':'';
  var td=new Date().getDay();
  return '<div class="card"><h2>🕒 ساعات العمل</h2>'+DAYS.map(function(d,k){return '<div class="hrow'+(JSD[k]===td?' today':'')+'"><span>'+d+'</span><span dir="ltr">'+(a[k].o?t12(a[k].f)+' - '+t12(a[k].t):'مغلق')+'</span></div>'}).join('')+'</div>';
}
function resizeImg(file){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var m=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/png')};im.onerror=rej;im.src=URL.createObjectURL(file)})}
async function store(slug){
  var r=await sb.from('shops').select('*').eq('slug',slug).maybeSingle(),s=r.data;
  if(!s){app.innerHTML='<div class="card"><h1>المحل غير موجود</h1></div>';return}

  sb.rpc('track',{p_slug:slug,p_kind:'view'}).then(function(){});
  var L=[];
  if(s.phone)L.push(['📞','اتصال','tel:+'+digits(s.phone),'call']);
  if(s.wa)L.push(['💬','واتساب','https://wa.me/'+digits(s.wa),'wa']);

  if(s.sc)L.push(['👻','سناب شات','https://snapchat.com/add/'+clean(s.sc),'sc']);
  if(s.tt)L.push(['🎵','تيك توك','https://tiktok.com/@'+clean(s.tt),'tt']);
  if(s.x)L.push(['✖️','إكس','https://x.com/'+clean(s.x),'x']);
  if(s.map)L.push(['📍','الموقع على خرائط قوقل',s.map,'map']);
  document.title=s.name;
  if(/^#[0-9a-fA-F]{6}$/.test(s.color||'')){
    var cl=s.color,lum=(0.299*parseInt(cl.substr(1,2),16)+0.587*parseInt(cl.substr(3,2),16)+0.114*parseInt(cl.substr(5,2),16))/255,ts=document.documentElement.style;
    document.body.style.background=cl;
    ts.setProperty('--ac',cl);ts.setProperty('--hf',lum>0.6?'#14181f':'#fff');ts.setProperty('--lb','#fff');ts.setProperty('--lt',cl);
  }
  app.innerHTML='<div class="hero"><div class="logo">'+(/^https:\/\//.test(s.logo||'')?'<img src="'+esc(s.logo)+'" alt="">':esc(s.name.charAt(0)))+'</div><h1>'+esc(s.name)+'</h1><div class="mu">'+esc(s.descr)+'</div></div>'+
   L.map(function(l){return '<a class="lnk" data-k="'+l[3]+'" target="_blank" rel="noopener" href="'+esc(l[2])+'"><i>'+l[0]+'</i>'+l[1]+'</a>'}).join('')+hoursHtml(s.hours)+'<button class="s" id="sh">مشاركة الصفحة</button>';
  [].forEach.call(app.querySelectorAll('a[data-k]'),function(a){a.addEventListener('click',function(){sb.rpc('track',{p_slug:slug,p_kind:a.getAttribute('data-k')}).then(function(){})})});
  document.getElementById('sh').onclick=function(){var u=location.href;if(navigator.share)navigator.share({title:s.name,url:u});else if(navigator.clipboard){navigator.clipboard.writeText(u);alert('تم نسخ الرابط')}};
}
function login(){
  app.innerHTML='<div class="card"><h1>🔐 لوحة التحكم</h1><label>الإيميل</label><input id="em" type="email" dir="ltr"><label>كلمة المرور</label><input id="pw" type="password" dir="ltr"><button id="go">دخول</button><p class="mu" id="msg"></p></div>';
  document.getElementById('go').onclick=async function(){
    var r=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
    if(r.error)document.getElementById('msg').textContent='خطأ: '+r.error.message;else route();
  };
}
var KL={call:'اتصال',wa:'واتساب',ig:'إنستقرام',sc:'سناب',tt:'تيك توك',x:'إكس',map:'الخريطة'};
var tab='home',q='',flt='all',view=null,ev=[],tpl=null;
function st(s){if(s.status==='paused')return['paused','موقوف'];var d=dleft(s);if(d==null)return['active','فعّال'];if(d<0)return['expired','منتهي'];if(d<=14)return['soon','ينتهي خلال '+d+' يوم'];return['active','فعّال']}
function dleft(s){return s.ends_on?Math.ceil((new Date(s.ends_on+'T23:59:59')-Date.now())/864e5):null}
function dk(d){d=new Date(d);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function S(n,l,c){return '<div class="stat"><b'+(c?' style="color:'+c+'"':'')+'>'+n+'</b><span>'+l+'</span></div>'}
function brow(l,n,m){return '<div class="br"><span>'+l+'</span><div><i style="width:'+Math.round(n/m*100)+'%"></i></div><b>'+n+'</b></div>'}
async function admin(){
  app.className='w wide';
  var r=await sb.from('shops').select('*').eq('owner_id',user.id).order('created_at');shops=r.data||[];
  var e=await sb.from('scan_events').select('shop_id,kind,created_at').gte('created_at',new Date(Date.now()-30*864e5).toISOString()).limit(10000);ev=e.data||[];
  render();
}
function render(){
  app.innerHTML='<div class="top"><b>📱 لوحة التحكم</b><button class="s sm" id="out">خروج</button></div>'+(view===null?'<div class="tabs">'+[['home','📊 نظرة عامة'],['shops','🏪 المحلات'],['subs','💳 الاشتراكات']].map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div id="pane"></div>':'<button class="s sm" id="bk" style="margin-bottom:10px">→ رجوع</button><div id="form"></div>');
  document.getElementById('out').onclick=async function(){await sb.auth.signOut();route()};
  if(view!==null){document.getElementById('bk').onclick=function(){view=null;tpl=null;render()};form(view);return}
  [].forEach.call(app.querySelectorAll('[data-t]'),function(b){b.onclick=function(){tab=b.getAttribute('data-t');render()}});
  ({home:home,shops:shopsPane,subs:subsPane})[tab]();
}
function bindAct(){
  [].forEach.call(app.querySelectorAll('[data-rn]'),function(b){b.onclick=async function(){var s=shops.filter(function(x){return x.id===b.getAttribute('data-rn')})[0],base=s.ends_on&&new Date(s.ends_on)>new Date()?new Date(s.ends_on):new Date();base.setDate(base.getDate()+365);var o={ends_on:ymd(base),status:'active'};if(!s.starts_on)o.starts_on=ymd(new Date());var r=await sb.from('shops').update(o).eq('id',s.id);if(r.error)alert(r.error.message);else admin()}});
  [].forEach.call(app.querySelectorAll('[data-pz]'),function(b){b.onclick=async function(){var s=shops.filter(function(x){return x.id===b.getAttribute('data-pz')})[0];var r=await sb.from('shops').update({status:s.status==='paused'?'active':'paused'}).eq('id',s.id);if(r.error)alert(r.error.message);else admin()}});
}
function home(){
  var cnt={active:0,soon:0,expired:0,paused:0},rev=0;
  shops.forEach(function(s){var z=st(s)[0];cnt[z]++;if(z==='active'||z==='soon')rev+=+s.price||0});
  var today=dk(new Date()),v=ev.filter(function(e){return e.kind==='view'});
  var t0=v.filter(function(e){return dk(e.created_at)===today}).length,t7=v.filter(function(e){return Date.now()-new Date(e.created_at)<7*864e5}).length,tot=shops.reduce(function(a,s){return a+(s.scans||0)},0);
  var days=[],i;for(i=13;i>=0;i--){var d=new Date(Date.now()-i*864e5);days.push({k:dk(d),l:d.getDate(),n:0})}
  v.forEach(function(e){var k=dk(e.created_at);days.forEach(function(x){if(x.k===k)x.n++})});
  var mx=Math.max.apply(null,days.map(function(x){return x.n}).concat([1]));
  var chart='<svg viewBox="0 0 280 110" style="width:100%">'+days.map(function(x,i){var h=Math.round(x.n/mx*76);return '<rect x="'+(i*20+3)+'" y="'+(88-h)+'" width="14" height="'+Math.max(h,2)+'" rx="3" fill="var(--ac)" opacity="'+(x.n?1:.25)+'"/><text x="'+(i*20+10)+'" y="102" font-size="8" text-anchor="middle" fill="var(--mu)">'+x.l+'</text>'+(x.n?'<text x="'+(i*20+10)+'" y="'+(84-h)+'" font-size="8" text-anchor="middle" fill="var(--tx)">'+x.n+'</text>':'')}).join('')+'</svg>';
  var kc={};ev.forEach(function(e){if(e.kind!=='view')kc[e.kind]=(kc[e.kind]||0)+1});
  var ks=Object.keys(kc).sort(function(a,b){return kc[b]-kc[a]}),km=kc[ks[0]]||1;
  var sv={};v.forEach(function(e){sv[e.shop_id]=(sv[e.shop_id]||0)+1});
  var top=shops.map(function(s){return{s:s,n:sv[s.id]||0}}).sort(function(a,b){return b.n-a.n}).slice(0,5),tm=top.length&&top[0].n||1;
  var al=shops.filter(function(s){var z=st(s)[0];return z==='soon'||z==='expired'});
  document.getElementById('pane').innerHTML='<div class="stats">'+S(shops.length,'المحلات')+S(cnt.active+cnt.soon,'اشتراكات فعّالة','#16a34a')+S(t0,'سكانات اليوم')+S(t7,'آخر 7 أيام')+S(tot,'إجمالي السكانات')+S(cnt.soon,'تنتهي قريباً','#d97706')+S(cnt.expired,'منتهية','#dc2626')+S(rev.toLocaleString('en'),'إيراد (ريال)')+'</div>'+
   '<div class="card"><h2>السكانات آخر 14 يوم</h2>'+chart+'</div>'+
   '<div class="card"><h2>أكثر الأزرار ضغطاً (30 يوم)</h2>'+(ks.length?ks.map(function(k){return brow(KL[k]||k,kc[k],km)}).join(''):'<p class="mu">لا توجد بيانات بعد. تظهر بعد أول ضغطات الزبائن.</p>')+'</div>'+
   '<div class="card"><h2>أفضل المحلات (30 يوم)</h2>'+(top.length?top.map(function(t){return brow(esc(t.s.name),t.n,tm)}).join(''):'<p class="mu">لا توجد محلات.</p>')+'</div>'+
   (al.length?'<div class="card"><h2>⚠️ تنبيهات الاشتراك</h2>'+al.map(function(s){var z=st(s);return '<div class="item" style="cursor:default"><div class="g"><b>'+esc(s.name)+'</b></div><span class="bd '+z[0]+'">'+z[1]+'</span><button data-rn="'+s.id+'" class="sm">تجديد</button></div>'}).join('')+'</div>':'');
  bindAct();
}
function shopsPane(){
  var p=document.getElementById('pane');
  p.innerHTML='<div class="row"><input id="q" placeholder="🔍 بحث بالاسم أو الرابط" value="'+esc(q)+'"><button id="nw" class="sm" style="margin-bottom:6px">+ جديد</button></div><div class="chips">'+[['all','الكل'],['active','فعّال'],['soon','ينتهي قريباً'],['expired','منتهي'],['paused','موقوف']].map(function(c){return '<button data-f="'+c[0]+'" class="'+(flt===c[0]?'on':'')+'">'+c[1]+'</button>'}).join('')+'</div><div class="card" id="lst"></div><button class="s" id="ex">تصدير CSV</button>';
  var n30={};ev.forEach(function(e){if(e.kind==='view')n30[e.shop_id]=(n30[e.shop_id]||0)+1});
  function list(){
    var h=shops.map(function(s,i){return{s:s,i:i}}).filter(function(x){var z=st(x.s)[0];return(flt==='all'||flt===z)&&(!q||(x.s.name+' '+x.s.slug).toLowerCase().indexOf(q.toLowerCase())>-1)}).map(function(x){var z=st(x.s),c=/^#[0-9a-fA-F]{6}$/.test(x.s.color||'')?x.s.color:'#0f766e';return '<div class="item" data-i="'+x.i+'"><div class="dot" style="background:'+c+'">'+esc(x.s.name.charAt(0))+'</div><div class="g"><b>'+esc(x.s.name)+'</b><div class="mu">'+esc(x.s.slug)+' · '+(n30[x.s.id]||0)+' سكان/30 يوم</div></div><span class="bd '+z[0]+'">'+z[1]+'</span></div>'}).join('');
    document.getElementById('lst').innerHTML=h||'<p class="mu">لا توجد نتائج.</p>';
    [].forEach.call(document.querySelectorAll('.item[data-i]'),function(el){el.onclick=function(){tpl=null;view=+el.getAttribute('data-i');render()}});
  }
  list();
  document.getElementById('q').oninput=function(){q=this.value;list()};
  document.getElementById('nw').onclick=function(){tpl=null;view=-1;render()};
  [].forEach.call(p.querySelectorAll('[data-f]'),function(b){b.onclick=function(){flt=b.getAttribute('data-f');render()}});
  document.getElementById('ex').onclick=function(){var rows=[['الاسم','الرابط','الهاتف','واتساب','الحالة','البداية','النهاية','السعر','السكانات']].concat(shops.map(function(s){return[s.name,s.slug,s.phone,s.wa,st(s)[1],s.starts_on,s.ends_on,s.price,s.scans||0]}));var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='shops.csv';a.click()};
}
function subsPane(){
  var a=shops.slice().sort(function(x,y){var dx=dleft(x),dy=dleft(y);return(dx==null?9e9:dx)-(dy==null?9e9:dy)}),rev=0;
  shops.forEach(function(s){var z=st(s)[0];if(z==='active'||z==='soon')rev+=+s.price||0});
  document.getElementById('pane').innerHTML='<div class="card"><h2>إيراد الاشتراكات الفعّالة</h2><b style="font-size:26px">'+rev.toLocaleString('en')+' ريال</b></div>'+(a.map(function(s){var z=st(s),d=dleft(s);return '<div class="card"><div class="item" style="border:0;padding:0;cursor:default"><div class="g"><b>'+esc(s.name)+'</b><div class="mu">'+(s.ends_on?'ينتهي '+s.ends_on+(d>=0?' · باقي '+d+' يوم':''):'بدون تاريخ انتهاء')+(s.price?' · '+s.price+' ريال':'')+'</div></div><span class="bd '+z[0]+'">'+z[1]+'</span></div><div class="row" style="margin-top:10px"><button data-rn="'+s.id+'" style="margin:0">تجديد سنة</button><button class="s" data-pz="'+s.id+'" style="margin:0">'+(s.status==='paused'?'تفعيل':'إيقاف')+'</button></div></div>'}).join('')||'<p class="mu">لا توجد محلات.</p>');
  bindAct();
}
var SUB=[['starts_on','بداية الاشتراك','date'],['ends_on','نهاية الاشتراك','date'],['price','سعر الاشتراك (ريال)','number'],['status','حالة الصفحة','select'],['notes','ملاحظات داخلية']];
function subIn(f,s){var v=s[f[0]]==null?'':s[f[0]];return '<label>'+f[1]+'</label>'+(f[2]==='select'?'<select id="f_status"><option value="active"'+(v!=='paused'?' selected':'')+'>فعّالة</option><option value="paused"'+(v==='paused'?' selected':'')+'>موقوفة</option></select>':'<input id="f_'+f[0]+'" type="'+(f[2]||'text')+'" value="'+esc(v)+'">')}
var F=[['name','اسم المحل'],['descr','وصف قصير'],['slug','الرابط القصير (إنجليزي بدون مسافات)'],['phone','رقم الاتصال (مع الرمز 966...)'],['wa','رقم الواتساب'],['ig','إنستقرام (اسم الحساب)'],['sc','سناب'],['tt','تيك توك'],['x','إكس'],['map','رابط خرائط قوقل']];
function form(i){
  var s=i>=0?shops[i]:(tpl||{}),box=document.getElementById('form');
  var H=parseH(s.hours)||DAYS.map(function(){return{o:true,f:'09:00',t:'23:00'}});
  var col=/^#[0-9a-fA-F]{6}$/.test(s.color||'')?s.color:COLORS[0],logo=s.logo||'';
  box.innerHTML='<div class="card"><h2>'+(i>=0?'تعديل المحل':'محل جديد')+'</h2>'+F.map(function(f){return '<label>'+f[1]+'</label><input id="f_'+f[0]+'" value="'+esc(s[f[0]])+'">'}).join('')+
   '<label>لون المحل</label><div class="sws">'+COLORS.map(function(c){return '<button type="button" class="sw" data-c="'+c+'" style="background:'+c+'"></button>'}).join('')+'<input type="color" id="cc" value="'+col+'" style="width:48px;height:36px;padding:2px;margin:0" title="لون مخصص"></div>'+
   '<label>ساعات العمل</label><div class="hr mu"><span>اليوم</span><span>مفتوح</span><span>من</span><span>إلى</span></div>'+
   DAYS.map(function(d,k){var h=H[k];return '<div class="hr"><span>'+d+'</span><input type="checkbox" class="ho"'+(h.o?' checked':'')+'><input type="time" class="hf" value="'+h.f+'"><input type="time" class="ht" value="'+h.t+'"></div>'}).join('')+
   '<button type="button" class="s" id="ha">تطبيق ساعات السبت على كل الأيام</button>'+
   '<label style="display:block;margin-top:12px">شعار المحل</label><div id="lp"></div><input type="file" id="lg" accept="image/*">'+
   '<h2 style="margin-top:14px">💳 الاشتراك</h2>'+SUB.map(function(f){return subIn(f,s)}).join('')+'<button id="sv">حفظ</button>'+(i>=0?'<button class="s" id="dup">نسخ المحل</button><button class="s" id="rm">حذف المحل</button>':'')+'</div><div id="qbox"></div>';
  box.scrollIntoView({behavior:'smooth'});
  if(i>=0)qr(s.slug);
  function mark(){[].forEach.call(box.querySelectorAll('.sw'),function(b){b.style.borderColor=b.getAttribute('data-c')===col?'var(--tx)':'var(--bd)'})}
  [].forEach.call(box.querySelectorAll('.sw'),function(b){b.onclick=function(){col=b.getAttribute('data-c');document.getElementById('cc').value=col;mark()}});
  document.getElementById('cc').oninput=function(){col=this.value;mark()};mark();
  document.getElementById('ha').onclick=function(){var r=box.querySelectorAll('.hr');var f=r[1].querySelector('.hf').value,t=r[1].querySelector('.ht').value,o=r[1].querySelector('.ho').checked;for(var k=2;k<r.length;k++){r[k].querySelector('.hf').value=f;r[k].querySelector('.ht').value=t;r[k].querySelector('.ho').checked=o}};
  function showLogo(){var lp=document.getElementById('lp');lp.innerHTML=logo?'<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><img src="'+esc(logo)+'" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover"><button type="button" class="s" id="lr" style="width:auto;margin:0;padding:6px 12px">إزالة الشعار</button></div>':'';var lr=document.getElementById('lr');if(lr)lr.onclick=function(){logo='';showLogo()}}
  showLogo();
  document.getElementById('sv').onclick=async function(){
    var btn=this,o={};F.concat(SUB).forEach(function(f){o[f[0]]=document.getElementById('f_'+f[0]).value.trim()});['starts_on','ends_on','price'].forEach(function(k){if(!o[k])o[k]=null});
    o.slug=o.slug.toLowerCase().replace(/[^a-z0-9-]/g,'');
    if(!o.name||!o.slug){alert('الاسم والرابط القصير مطلوبين');return}
    btn.textContent='جاري الحفظ...';btn.disabled=true;
    try{
      var file=document.getElementById('lg').files[0];
      if(file){var bl=await resizeImg(file),path=user.id+'/'+Date.now()+'.png',u=await sb.storage.from('logos').upload(path,bl,{contentType:'image/png'});
        if(u.error)throw new Error('تعذر رفع الشعار: '+u.error.message);
        logo=sb.storage.from('logos').getPublicUrl(path).data.publicUrl}
      o.logo=logo;o.color=col;
      o.hours=JSON.stringify([].map.call(box.querySelectorAll('.hr:not(.mu)'),function(r){return{o:r.querySelector('.ho').checked,f:r.querySelector('.hf').value||'09:00',t:r.querySelector('.ht').value||'23:00'}}));
      var r=i>=0?await sb.from('shops').update(o).eq('id',s.id):await sb.from('shops').insert(o);
      if(r.error)throw new Error(r.error.message.indexOf('duplicate')>-1?'الرابط مستخدم':r.error.message);
    }catch(e){alert(e.message);btn.textContent='حفظ';btn.disabled=false;return}
    tpl=null;view=null;await admin();view=shops.findIndex(function(x){return x.slug===o.slug});render();
  };
  var dp=document.getElementById('dup');if(dp)dp.onclick=function(){tpl=Object.assign({},s,{slug:s.slug+'-2',name:s.name+' (نسخة)',scans:0});view=-1;render()};
  var rm=document.getElementById('rm');
  if(rm)rm.onclick=async function(){if(confirm('حذف المحل؟')){await sb.from('shops').delete().eq('id',s.id);view=null;admin()}};
}
function qr(slug){
  var url=location.href.split('#')[0]+'#m-'+slug;
  document.getElementById('qbox').innerHTML='<div class="card" style="text-align:center"><h2>البار كود</h2><div id="qr"></div><p class="mu" style="word-break:break-all" dir="ltr">'+esc(url)+'</p><a class="btn" target="_blank" href="#m-'+esc(slug)+'">معاينة صفحة الزبون</a><button id="dl">تحميل البار كود PNG</button></div>';
  document.getElementById('dl').onclick=function(){var c=document.querySelector('#qr canvas');var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qr-'+slug+'.png';a.click()};
  new QRCode(document.getElementById('qr'),{text:url,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});
}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
