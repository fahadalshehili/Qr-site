<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقة المحل الذكية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6ea;--ac:#0f766e;--act:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mu:#98a2b3;--bd:#272d37;--ac:#2dd4bf;--act:#06201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
.w{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}
input{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}
button,.btn{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:var(--act);font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;margin-top:8px}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.shop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.shop:last-child{border:0}
.hero{text-align:center;padding:24px 8px 12px}
.logo{width:72px;height:72px;border-radius:50%;background:var(--lb,var(--ac));color:var(--lt,var(--act));overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 10px}
.lnk{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;color:var(--tx);text-decoration:none;font-weight:600}
.lnk i{font-style:normal;font-size:20px}
input[type=time]{margin:0;padding:8px;direction:ltr}
.hr{display:grid;grid-template-columns:62px 40px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.hr input[type=checkbox]{width:20px;height:20px;margin:0}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.sw{width:36px;height:36px;padding:0;margin:0;border-radius:50%;border:3px solid var(--bd)}
.hrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.hrow:last-child{border:0}.today{font-weight:700;background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:8px;padding-inline:8px}
.hero h1,.hero .mu{color:var(--hf,var(--tx))}
#sh{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#qr canvas,#qr img{width:220px;height:220px}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
#qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px;width:max-content;margin:8px auto}
</style>
</head>
<body>
<div class="w" id="app">جاري التحميل...</div>
<script>
// ====== إعدادات Supabase ======
var SUPABASE_URL='https://rizklgstmbslmfvqhuuw.supabase.co';
var SUPABASE_KEY='sb_publishable_zp9FHR3ue1bcRulefHvA6g_HKK0pmUD';
// ===============================
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var app=document.getElementById('app'),user=null,shops=[];
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function clean(s){return String(s||'').trim().replace(/^@/,'')}
function digits(s){return String(s||'').replace(/\D/g,'')}

function resetTheme(){document.body.style.background='';['--ac','--act','--hf','--lb','--lt'].forEach(function(v){document.documentElement.style.removeProperty(v)})}
async function route(){
  resetTheme();
  var h=location.hash.slice(1);
  if(h.indexOf('m-')===0)return store(h.slice(2));
  var r=await sb.auth.getSession();user=r.data.session?r.data.session.user:null;
  user?admin():login();
}
var DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],JSD=[6,0,1,2,3,4,5];
var COLORS=['#0f766e','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#16a34a','#111827'];
function parseH(h){try{var a=JSON.parse(h);if(Array.isArray(a)&&a.length==7)return a}catch(e){}return null}
function t12(t){var p=String(t).split(':'),h=+p[0],m=p[1]||'00',x=h>=12?'م':'ص';h=h%12||12;return h+':'+m+' '+x}
function hoursHtml(h){
  var a=parseH(h);
  if(!a)return h?'<p class="mu" style="text-align:center">🕒 '+esc(h)+'</p>':'';
  var td=new Date().getDay();
  return '<div class="card"><h2>🕒 ساعات العمل</h2>'+DAYS.map(function(d,k){return '<div class="hrow'+(JSD[k]===td?' today':'')+'"><span>'+d+'</span><span dir="ltr">'+(a[k].o?t12(a[k].f)+' - '+t12(a[k].t):'مغلق')+'</span></div>'}).join('')+'</div>';
}
function resizeImg(file){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var m=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/png')};im.onerror=rej;im.src=URL.createObjectURL(file)})}
async function store(slug){
  var r=await sb.from('shops').select('*').eq('slug',slug).maybeSingle(),s=r.data;
  if(!s){app.innerHTML='<div class="card"><h1>المحل غير موجود</h1></div>';return}
  sb.rpc('add_scan',{p_slug:slug});
  var L=[];
  if(s.phone)L.push(['📞','اتصال','tel:+'+digits(s.phone)]);
  if(s.wa)L.push(['💬','واتساب','https://wa.me/'+digits(s.wa)]);
  if(s.ig)L.push(['📸','إنستقرام','https://instagram.com/'+clean(s.ig)]);
  if(s.sc)L.push(['👻','سناب شات','https://snapchat.com/add/'+clean(s.sc)]);
  if(s.tt)L.push(['🎵','تيك توك','https://tiktok.com/@'+clean(s.tt)]);
  if(s.x)L.push(['✖️','إكس','https://x.com/'+clean(s.x)]);
  if(s.map)L.push(['📍','الموقع على خرائط قوقل',s.map]);
  document.title=s.name;
  if(/^#[0-9a-fA-F]{6}$/.test(s.color||'')){document.documentElement.style.setProperty('--ac',s.color);document.documentElement.style.setProperty('--act','#fff')}
  app.innerHTML='<div class="hero"><div class="logo">'+(/^https:\/\//.test(s.logo||'')?'<img src="'+esc(s.logo)+'" alt="">':esc(s.name.charAt(0)))+'</div><h1>'+esc(s.name)+'</h1><div class="mu">'+esc(s.descr)+'</div></div>'+
   L.map(function(l){return '<a class="lnk" target="_blank" rel="noopener" href="'+esc(l[2])+'"><i>'+l[0]+'</i>'+l[1]+'</a>'}).join('')+hoursHtml(s.hours)+'<button class="s" id="sh">مشاركة الصفحة</button>';
  document.getElementById('sh').onclick=function(){var u=location.href;if(navigator.share)navigator.share({title:s.name,url:u});else if(navigator.clipboard){navigator.clipboard.writeText(u);alert('تم نسخ الرابط')}};
}
function login(){
  app.innerHTML='<div class="card"><h1>🔐 لوحة التحكم</h1><label>الإيميل</label><input id="em" type="email" dir="ltr"><label>كلمة المرور</label><input id="pw" type="password" dir="ltr"><button id="go">دخول</button><p class="mu" id="msg"></p></div>';
  document.getElementById('go').onclick=async function(){
    var r=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
    if(r.error)document.getElementById('msg').textContent='خطأ: '+r.error.message;else route();
  };
}
async function admin(){
  var r=await sb.from('shops').select('*').eq('owner_id',user.id).order('created_at');shops=r.data||[];
  var total=shops.reduce(function(a,s){return a+(s.scans||0)},0);
  app.innerHTML='<h1>لوحة التحكم</h1><div class="card"><h2>المحلات ('+shops.length+') · السكانات: '+total+'</h2><div id="list"></div><button id="new">+ محل جديد</button><button class="s" id="out">تسجيل الخروج</button></div><div id="form"></div>';
  document.getElementById('list').innerHTML=shops.map(function(s,i){return '<div class="shop"><div><b>'+esc(s.name)+'</b><div class="mu">'+esc(s.slug)+' · '+(s.scans||0)+' سكان</div></div><button class="s" style="width:auto;margin:0;padding:8px 14px" data-i="'+i+'">تعديل</button></div>'}).join('');
  [].forEach.call(document.querySelectorAll('[data-i]'),function(b){b.onclick=function(){form(+b.getAttribute('data-i'))}});
  document.getElementById('new').onclick=function(){form(-1)};
  document.getElementById('out').onclick=async function(){await sb.auth.signOut();route()};
}
var F=[['name','اسم المحل'],['descr','وصف قصير'],['slug','الرابط القصير (إنجليزي بدون مسافات)'],['phone','رقم الاتصال (مع الرمز 966...)'],['wa','رقم الواتساب'],['ig','إنستقرام (اسم الحساب)'],['sc','سناب'],['tt','تيك توك'],['x','إكس'],['map','رابط خرائط قوقل']];
function form(i){
  var s=i>=0?shops[i]:{},box=document.getElementById('form');
  var H=parseH(s.hours)||DAYS.map(function(){return{o:true,f:'09:00',t:'23:00'}});
  var col=/^#[0-9a-fA-F]{6}$/.test(s.color||'')?s.color:COLORS[0],logo=s.logo||'';
  box.innerHTML='<div class="card"><h2>'+(i>=0?'تعديل المحل':'محل جديد')+'</h2>'+F.map(function(f){return '<label>'+f[1]+'</label><input id="f_'+f[0]+'" value="'+esc(s[f[0]])+'">'}).join('')+
   '<label>لون المحل</label><div class="sws">'+COLORS.map(function(c){return '<button type="button" class="sw" data-c="'+c+'" style="background:'+c+'"></button>'}).join('')+'<input type="color" id="cc" value="'+col+'" style="width:48px;height:36px;padding:2px;margin:0" title="لون مخصص"></div>'+
   '<label>ساعات العمل</label><div class="hr mu"><span>اليوم</span><span>مفتوح</span><span>من</span><span>إلى</span></div>'+
   DAYS.map(function(d,k){var h=H[k];return '<div class="hr"><span>'+d+'</span><input type="checkbox" class="ho"'+(h.o?' checked':'')+'><input type="time" class="hf" value="'+h.f+'"><input type="time" class="ht" value="'+h.t+'"></div>'}).join('')+
   '<button type="button" class="s" id="ha">تطبيق ساعات السبت على كل الأيام</button>'+
   '<label style="display:block;margin-top:12px">شعار المحل</label><div id="lp"></div><input type="file" id="lg" accept="image/*">'+
   '<button id="sv">حفظ</button>'+(i>=0?'<button class="s" id="rm">حذف المحل</button>':'')+'</div><div id="qbox"></div>';
  box.scrollIntoView({behavior:'smooth'});
  if(i>=0)qr(s.slug);
  function mark(){[].forEach.call(box.querySelectorAll('.sw'),function(b){b.style.borderColor=b.getAttribute('data-c')===col?'var(--tx)':'var(--bd)'})}
  [].forEach.call(box.querySelectorAll('.sw'),function(b){b.onclick=function(){col=b.getAttribute('data-c');document.getElementById('cc').value=col;mark()}});
  document.getElementById('cc').oninput=function(){col=this.value;mark()};mark();
  document.getElementById('ha').onclick=function(){var r=box.querySelectorAll('.hr');var f=r[1].querySelector('.hf').value,t=r[1].querySelector('.ht').value,o=r[1].querySelector('.ho').checked;for(var k=2;k<r.length;k++){r[k].querySelector('.hf').value=f;r[k].querySelector('.ht').value=t;r[k].querySelector('.ho').checked=o}};
  function showLogo(){var lp=document.getElementById('lp');lp.innerHTML=logo?'<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><img src="'+esc(logo)+'" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover"><button type="button" class="s" id="lr" style="width:auto;margin:0;padding:6px 12px">إزالة الشعار</button></div>':'';var lr=document.getElementById('lr');if(lr)lr.onclick=function(){logo='';showLogo()}}
  showLogo();
  document.getElementById('sv').onclick=async function(){
    var btn=this,o={};F.forEach(function(f){o[f[0]]=document.getElementById('f_'+f[0]).value.trim()});
    o.slug=o.slug.toLowerCase().replace(/[^a-z0-9-]/g,'');
    if(!o.name||!o.slug){alert('الاسم والرابط القصير مطلوبين');return}
    btn.textContent='جاري الحفظ...';btn.disabled=true;
    try{
      var file=document.getElementById('lg').files[0];
      if(file){var bl=await resizeImg(file),path=user.id+'/'+Date.now()+'.png',u=await sb.storage.from('logos').upload(path,bl,{contentType:'image/png'});
        if(u.error)throw new Error('تعذر رفع الشعار: '+u.error.message);
        logo=sb.storage.from('logos').getPublicUrl(path).data.publicUrl}
      o.logo=logo;o.color=col;
      o.hours=JSON.stringify([].map.call(box.querySelectorAll('.hr:not(.mu)'),function(r){return{o:r.querySelector('.ho').checked,f:r.querySelector('.hf').value||'09:00',t:r.querySelector('.ht').value||'23:00'}}));
      var r=i>=0?await sb.from('shops').update(o).eq('id',s.id):await sb.from('shops').insert(o);
      if(r.error)throw new Error(r.error.message.indexOf('duplicate')>-1?'الرابط مستخدم':r.error.message);
    }catch(e){alert(e.message);btn.textContent='حفظ';btn.disabled=false;return}
    await admin();var k=shops.findIndex(function(x){return x.slug===o.slug});form(k);
  };
  var rm=document.getElementById('rm');
  if(rm)rm.onclick=async function(){if(confirm('حذف المحل؟')){await sb.from('shops').delete().eq('id',s.id);admin()}};
}
function qr(slug){
  var url=location.href.split('#')[0]+'#m-'+slug;
  document.getElementById('qbox').innerHTML='<div class="card" style="text-align:center"><h2>البار كود</h2><div id="qr"></div><p class="mu" style="word-break:break-all" dir="ltr">'+esc(url)+'</p><a class="btn" target="_blank" href="#m-'+esc(slug)+'">معاينة صفحة الزبون</a><button id="dl">تحميل البار كود PNG</button></div>';
  document.getElementById('dl').onclick=function(){var c=document.querySelector('#qr canvas');var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qr-'+slug+'.png';a.click()};
  new QRCode(document.getElementById('qr'),{text:url,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});
}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
