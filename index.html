.dot{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}

  function showLogo(){var lp=document.getElementById('lp');lp.innerHTML=logo?'<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><img src="'+esc(logo)+'" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover"><button type="button" class="s" id="lr" style="width:auto;margin:0;padding:6px 12px">إزالة الشعار</button></div>':'';var lr=document.getElementById('lr');if(lr)lr.onclick=function(){logo='';showLogo()}}

  edList(document.getElementById('ed_ln'),LK,[['t','عنوان الزر'],['u','الرابط',1]],'+ زر');

function qr(slug,SR){
  var base=location.href.split('#')[0],srcs=[{k:'',n:'الرئيسي'}].concat((SR||[]).filter(function(x){return x.k}));
  document.getElementById('qbox').innerHTML='<div class="card" style="text-align:center"><h2>البار كود</h2>'+(srcs.length>1?'<select id="qs">'+srcs.map(function(x){return '<option value="'+esc(x.k)+'">'+esc(x.n||x.k)+'</option>'}).join('')+'</select>':'')+'<div id="qr"></div><p class="mu" style="word-break:break-all" dir="ltr" id="qu"></p><a class="btn" id="qp" target="_blank">معاينة صفحة الزبون</a><button id="dl">تحميل البار كود PNG</button></div>';
  var blob=null,fname,url;
  function gen(){
    var k=srcs.length>1?document.getElementById('qs').value:'';
    url=base+'#m-'+slug+(k?'~'+k:'');fname='qr-'+slug+(k?'-'+k:'')+'.png';blob=null;
    document.getElementById('qr').innerHTML='';document.getElementById('qu').textContent=url;document.getElementById('qp').href=url;
    new QRCode(document.getElementById('qr'),{text:url,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});
    setTimeout(function(){
      var c=document.querySelector('#qr canvas');if(!c)return;
      var o=document.createElement('canvas');o.width=o.height=720;var x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,720,720);x.drawImage(c,60,60,600,600);
      o.toBlob(function(b){blob=b},'image/png');
    },300);
  }
  if(srcs.length>1)document.getElementById('qs').onchange=gen;
  gen();
  document.getElementById('dl').onclick=async function(){
    if(!blob){alert('انتظر ثانية ثم اضغط مرة ثانية');return}
    var f=new File([blob],fname,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fname});return}}catch(e){if(e&&e.name==='AbortError')return}
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
  };
}
